# E-TAP pipeline. Stages follow the software lifecycle: verify, secure, package, release.
# The hosted app runs on Render (API) and Vercel (dashboard). To enable the deploy job, add a masked CI/CD
# variable RENDER_DEPLOY_HOOK_URL (Render service > Settings > Deploy Hook). Without it the job does not appear.

stages:
  - verify
  - test
  - package
  - release

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"

default:
  interruptible: true

backend-tests:
  stage: verify
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends tesseract-ocr libzbar0 && rm -rf /var/lib/apt/lists/*
    - pip install -r backend/requirements.txt -r backend/requirements-dev.txt
  script:
    - cd backend
    - python -m pytest tests -q --ignore=tests/test_threat_intel_live.py --junitxml=report.xml
  variables:
    USE_FAKE_DB: "1"
  cache:
    key: pip
    paths: [.cache/pip]
  artifacts:
    when: always
    reports:
      junit: backend/report.xml

frontend-tests:
  stage: verify
  image: node:22-slim
  script:
    - cd frontend
    - npm ci
    - npm test
    - npx vite build
  cache:
    key: npm
    paths: [.cache/npm]
  artifacts:
    paths: [frontend/dist]
    expire_in: 1 week

extension-tests:
  stage: verify
  image: node:24-slim
  script:
    - node --test --test-isolation=none extension/tests/*.test.mjs

# Every detection rule carries its own test cases; this runs only those, so a rule change is judged on its own.
detection-rules:
  stage: test
  image: python:3.11-slim
  rules:
    - changes: ["backend/sandbox/rules/**/*", "backend/sandbox/rule_engine.py", "backend/sandbox/ecs_convert.py"]
  before_script:
    - pip install -r backend/requirements.txt -r backend/requirements-dev.txt
  script:
    - cd backend
    - python -m pytest tests/test_sandbox_rules.py -q

# The built-in scanners above run in the test stage; keep their findings visible on merge requests.
sast:
  stage: test
secret_detection:
  stage: test
gemnasium-python-dependency_scanning:
  stage: test

# Proves the API image still builds. Nothing is pushed anywhere.
build-image:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t etap-api:$CI_COMMIT_SHORT_SHA backend

# Production is a manual step: a person (or an approved agent run) presses play. Render rebuilds from the repository.
deploy-production:
  stage: release
  image: curlimages/curl:8.10.1
  needs: [build-image]
  environment:
    name: production
  when: manual
  rules:
    - if: $RENDER_DEPLOY_HOOK_URL && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
